name: Local vault and extension tests
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      NOMOREPWN_DATA: ${{ runner.temp }}/nomorepwn-fixture-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts
        working-directory: extension
      - run: npm test
        working-directory: extension
      - run: python extension/build.py
      - run: git diff --exit-code -- extension/dist
      - run: python tests/browser_capture_e2e.py
      - run: python tests/native_capture_e2e.py
